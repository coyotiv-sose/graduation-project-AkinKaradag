name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint backend and frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run eslint:check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend (oxlint)
        working-directory: frontend
        run: npx oxlint .

      - name: Lint frontend (eslint)
        working-directory: frontend
        run: npx eslint . --max-warnings=0

  build-check:
    name: Build checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend syntax check
        working-directory: backend
        run: find src bin -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

  docker-validate:
    name: Docker image validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Placeholer env files
        run: touch backend/.env frontend/.env

      - name: Validate docker compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build backend production image
        run: docker build -f backend/Dockerfile.production -t routewerk-api-ci ./backend

      - name: Build frontend production image
        run: docker build -f frontend/Dockerfile.production -t routewerk-frontend-ci ./frontend